name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e:
    # A real Paseo daemon with the plugin installed, agents answered from e2e/cassettes. No API key needed.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
      - run: npm ci
      - run: npm ci --prefix e2e
      - run: npm --prefix e2e run typecheck
      - run: npm run e2e
        env:
          E2E_KEEP: "1"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-sandbox
          path: /tmp/paseo-asks-e2e-*/paseo/*.log
          if-no-files-found: ignore
