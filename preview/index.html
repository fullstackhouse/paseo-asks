<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Asks preview</title>
    <style>
      html,
      body {
        margin: 0;
        background: #08090b;
        font-family: -apple-system, system-ui, sans-serif;
      }
      /* Same as Paseo's packages/app/src/styles/install-web-scrollbar-styles.web.ts, so scrollbars look like the app. */
      * {
        scrollbar-color: color-mix(in srgb, #a1a1aa 40%, transparent) transparent;
        scrollbar-width: thin;
      }
      #root {
        display: flex;
        flex-wrap: wrap;
        gap: 32px;
        padding: 32px;
        align-items: flex-start;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
